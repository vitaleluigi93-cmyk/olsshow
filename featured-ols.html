<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<title>OLS Featured Chat</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #f6f1e4;
    --ink: #14120d;
    --muted: #6b665a;
    --gold: #F4C430;
    --gold-text: #8a6700;
    --yt: #e62117;
    --tw: #8a4fff;
  }
  * { margin:0; padding:0; box-sizing:border-box; }

  html, body {
    width:100vw; height:100vh;
    background: transparent;
    overflow: hidden;
    font-family: 'Oswald', 'Arial Narrow', sans-serif;
  }

  /* ancorato in basso al centro; la carta si adatta al contenuto fino a 84% della larghezza */
  body {
    display:flex; align-items:flex-end; justify-content:center;
    padding-bottom: 56px;
  }
  #container { display:flex; justify-content:center; width:100vw; }

  .card {
    display:flex; align-items:flex-start; gap:28px;
    width: fit-content;
    min-width: 560px;
    max-width: 84vw;
    max-height: 44vh;
    padding: 26px 44px 28px 30px;
    background: var(--paper);
    border-radius: 10px;
    box-shadow: 0 8px 28px rgba(0,0,0,.38);
    opacity:0; transform: translateY(24px);
    transition: opacity .4s ease-out, transform .4s cubic-bezier(.2,.8,.25,1);
  }
  .card.show { opacity:1; transform:none; }
  /* filo oro a sinistra: solo per gli abbonati */
  .card.sub { box-shadow: inset 9px 0 0 var(--gold), 0 8px 28px rgba(0,0,0,.38); padding-left: 40px; }

  .avatar {
    flex: 0 0 auto;
    width: 92px; height: 92px; border-radius: 50%;
    background: var(--gold);
    color: var(--ink);
    display:flex; align-items:center; justify-content:center;
    font-weight: 600; font-size: 46px;
    overflow: hidden;
  }
  .avatar img { width:100%; height:100%; object-fit:cover; display:block; }

  .content { min-width:0; display:flex; flex-direction:column; gap:6px; }

  .who { display:flex; align-items:baseline; gap:18px; flex-wrap:wrap; }
  .name { font-weight:600; font-size:36px; line-height:1.1; color:var(--ink); }
  .meta { display:flex; align-items:center; gap:16px; font-size:24px; font-weight:500; color:var(--muted); }
  .platform { display:flex; align-items:center; gap:8px; }
  .dot { width:11px; height:11px; border-radius:50%; background:#888; }
  .dot.youtube { background:var(--yt); }
  .dot.twitch { background:var(--tw); }
  .badge { color: var(--gold-text); font-weight:600; }

  .message {
    color: var(--ink);
    font-weight: 400;
    line-height: 1.28;
    overflow-wrap: anywhere;
    white-space: pre-wrap;
    overflow: hidden;
    font-size: 58px;
  }
  /* dimensione adattiva: i testi lunghi si allargano e si rimpiccioliscono, non si allungano in altezza */
  .message.l2 { font-size: 50px; }
  .message.l3 { font-size: 42px; }
  .message.l4 { font-size: 36px; }
  .message img { height:1.25em; width:auto; vertical-align:-0.25em; margin:0 2px; }
</style>
</head>
<body>

<div id="container"></div>

<script>
  const urlParams = new URLSearchParams(window.location.search);
  const session = urlParams.get('session') || 'xMYd3nZK7g';
  const channel = parseInt(urlParams.get('channel') || '4', 10);
  const showtime = parseInt(urlParams.get('showtime')) || 12000; // ms; i messaggi lunghi restano di più

  let socket = null;
  let hideTimer = null;

  /* etichette in italiano per eventi e donazioni */
  const EVENT_LABELS = {
    donation: 'Donazione', donations: 'Donazione', tip: 'Donazione',
    subscription: 'Nuovo abbonato', subscriber: 'Nuovo abbonato', sub: 'Nuovo abbonato',
    resub: 'Abbonato', membership: 'Nuovo abbonato', member: 'Nuovo abbonato',
    giftsub: 'Abbonamento regalato', giftedsub: 'Abbonamento regalato', gift: 'Abbonamento regalato',
    follow: 'Nuovo follower', follower: 'Nuovo follower',
    raid: 'Raid', cheer: 'Bit', bits: 'Bit',
    superchat: 'Super Chat', supersticker: 'Super Sticker'
  };
  const evLabel = k => EVENT_LABELS[String(k || '').toLowerCase().replace(/[\s_-]/g, '')] || null;

  connect();

  function connect(){
    socket = new WebSocket('wss://io.socialstream.ninja:443');

    socket.addEventListener('open', () => {
      socket.send(JSON.stringify({ join: session, in: channel, out: channel }));
    });

    socket.addEventListener('message', (event) => {
      let data;
      try { data = JSON.parse(event.data); } catch(e){ return; }
      if (data && data.overlayNinja) data = data.overlayNinja;
      // ignora messaggi di sistema / join ack
      if (!data || (!data.chatmessage && !data.chatname)) return;
      renderMessage(data);
    });

    socket.addEventListener('close', () => { setTimeout(connect, 3000); });
    socket.addEventListener('error', () => { socket.close(); });
  }

  /* testo + sole emote <img>; tutto il resto viene scartato */
  function renderText(target, html) {
    const doc = new DOMParser().parseFromString('<div>' + (html || '') + '</div>', 'text/html');
    (function walk(node) {
      node.childNodes.forEach(n => {
        if (n.nodeType === 3) target.appendChild(document.createTextNode(n.textContent));
        else if (n.nodeName === 'IMG') {
          const src = n.getAttribute('src') || '';
          if (/^https?:\/\//i.test(src)) {
            const im = document.createElement('img'); im.src = src; target.appendChild(im);
          }
        } else walk(n);
      });
    })(doc.body.firstChild);
  }

  function renderMessage(data){
    const container = document.getElementById('container');
    container.innerHTML = '';

    const name = String(data.chatname || '').trim();
    const raw = String(data.chatmessage || '');
    const plainLen = raw.replace(/<[^>]*>/g, '').length;

    const type = String(data.type || '').toLowerCase();
    const platform = type === 'youtube' ? 'youtube' : type === 'twitch' ? 'twitch' : 'other';
    const platformName = platform === 'youtube' ? 'YouTube' : platform === 'twitch' ? 'Twitch' : (type || 'Chat');

    const ev = evLabel(data.event) || evLabel(data.eventType);
    const isSub = !!(data.membership || data.subscriber || data.hasMembership);
    const extra = data.hasDonation ? ('Donazione ' + data.hasDonation) : ev;

    const card = document.createElement('div');
    card.className = 'card' + (isSub ? ' sub' : '');

    /* avatar: immagine profilo se disponibile, altrimenti iniziale */
    const avatar = document.createElement('div'); avatar.className = 'avatar';
    const initial = () => { avatar.textContent = (name[0] || '?').toUpperCase(); };
    if (data.chatimg) {
      const im = document.createElement('img');
      im.referrerPolicy = 'no-referrer';
      im.src = data.chatimg;
      im.onerror = () => { im.remove(); initial(); };
      avatar.appendChild(im);
    } else initial();

    const content = document.createElement('div'); content.className = 'content';
    const who = document.createElement('div'); who.className = 'who';
    const nm = document.createElement('div'); nm.className = 'name'; nm.textContent = name;
    const meta = document.createElement('div'); meta.className = 'meta';
    const pf = document.createElement('div'); pf.className = 'platform';
    const dot = document.createElement('span'); dot.className = 'dot ' + platform;
    const pfText = document.createElement('span'); pfText.textContent = platformName;
    pf.appendChild(dot); pf.appendChild(pfText); meta.appendChild(pf);
    if (isSub) { const b = document.createElement('span'); b.className = 'badge'; b.textContent = 'Abbonato'; meta.appendChild(b); }
    if (extra) { const b = document.createElement('span'); b.className = 'badge'; b.textContent = extra; meta.appendChild(b); }
    who.appendChild(nm); who.appendChild(meta);

    const message = document.createElement('div');
    message.className = 'message' + (plainLen > 280 ? ' l4' : plainLen > 150 ? ' l3' : plainLen > 70 ? ' l2' : '');
    renderText(message, raw);

    content.appendChild(who); content.appendChild(message);
    card.appendChild(avatar); card.appendChild(content);
    container.appendChild(card);

    requestAnimationFrame(() => card.classList.add('show'));

    /* i testi lunghi restano più a lungo: +1s ogni 25 caratteri oltre i 100 */
    const hold = showtime + Math.max(0, plainLen - 100) * 40;
    clearTimeout(hideTimer);
    hideTimer = setTimeout(() => {
      card.classList.remove('show');
      setTimeout(() => { container.innerHTML = ''; }, 450);
    }, hold);
  }

  /* anteprima: ?demo (abbonato) · ?demo=corto · ?demo=lungo */
  if (urlParams.has('demo')) {
    const d = urlParams.get('demo');
    const sample = {
      corto: { chatname: 'Zebrina99', chatmessage: 'Fino alla fine!', type: 'twitch' },
      lungo: { chatname: 'Marco_Bianconero', chatmessage: 'Secondo me Spalletti deve cambiare modulo: il centrocampo è troppo lento, non copriamo le fasce e quando perdiamo palla in uscita siamo sempre scoperti. Con Locatelli e Thuram più vicini a Yildiz la squadra respira, ma serve qualcuno che giochi tra le linee senza aspettare il tuo passaggio, altrimenti ripetiamo sempre la stessa partita.', type: 'youtube' }
    };
    renderMessage(sample[d] || { chatname: 'Tifoso_Doc', chatmessage: 'Secondo me Spalletti deve cambiare modulo: il centrocampo è troppo lento e non copriamo le fasce.', type: 'youtube', membership: true });
  }
</script>

</body>
</html>
