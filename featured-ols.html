<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<title>OLS Featured Chat</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Oswald:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --gold: #F4C430;
    --ivory: #f7f2e4;
    --ink: #0b0b0b;
  }
  * { margin:0; padding:0; box-sizing:border-box; }

  html, body {
    width:100vw;
    height:100vh;
    background: transparent;
    overflow: hidden;
    font-family: 'Oswald', 'Arial Narrow', -apple-system, 'Segoe UI', sans-serif;
  }

  /* ancorato in basso, centrato orizzontalmente */
  body {
    display:flex;
    align-items:flex-end;
    justify-content:center;
    padding-bottom: 48px;
  }

  #container {
    width: 90vw;
    max-width: 1400px;
    display:flex;
    justify-content:center;
  }

  .card {
    position: relative;
    display: flex;
    width: 100%;
    max-height: 42vh;
    background: var(--ivory);
    border: 5px solid var(--gold);
    border-radius: 6px;
    box-shadow: 0 0 0 3px var(--ink), 0 0 30px rgba(244,196,48,.6), 0 10px 30px rgba(0,0,0,.6);
    overflow: hidden;
    opacity: 0;
    transform: translateY(40px);
    transition: opacity .35s ease-out, transform .35s cubic-bezier(.2,.9,.25,1);
  }
  .card.show { opacity: 1; transform: translateY(0); }

  /* banda pinstripe bianconera sul lato sinistro */
  .stripe {
    flex: 0 0 22px;
    background: repeating-linear-gradient(135deg, #0b0b0b 0 7px, #ffffff 7px 14px);
    border-right: 4px solid var(--gold);
  }

  .body { flex: 1; min-width: 0; display: flex; flex-direction: column; }

  .head {
    position: relative;
    display: flex; align-items: center; gap: 14px;
    background: var(--ink);
    padding: 10px 20px 8px 16px;
  }
  .head::after {
    content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 3px;
    background: linear-gradient(90deg, var(--gold), transparent 85%);
  }

  .avatar {
    flex: 0 0 auto;
    width: 54px; height: 54px;
    border-radius: 50%;
    border: 3px solid var(--gold);
    background: #222 center/cover no-repeat;
  }

  .name {
    font-family: 'Anton', 'Oswald', sans-serif;
    font-size: 38px; line-height: 1;
    letter-spacing: .06em;
    text-transform: uppercase;
    color: var(--gold);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    padding-top: 3px;
  }

  .tags { margin-left: auto; display: flex; align-items: center; gap: 10px; flex: 0 0 auto; }
  .tag {
    font-family: 'Anton', 'Oswald', sans-serif;
    font-size: 18px; letter-spacing: .14em; text-transform: uppercase;
    background: var(--gold); color: var(--ink);
    padding: 5px 10px 3px; border-radius: 3px;
  }
  .chip {
    font-weight: 600; font-size: 16px; letter-spacing: .12em; text-transform: uppercase;
    color: #fff; padding: 5px 11px 3px; border-radius: 3px;
  }
  .chip.youtube { background: #e62117; }
  .chip.twitch  { background: #7b3fe4; }
  .chip.other   { background: #444; }

  .message {
    font-weight: 500;
    font-size: 40px; line-height: 1.25;
    color: var(--ink);
    padding: 14px 24px 18px;
    word-wrap: break-word; overflow-wrap: anywhere;
    white-space: pre-wrap;
    overflow-y: auto;
  }
  .message img { height: 1.4em; width: auto; vertical-align: -0.3em; margin: 0 2px; }

  /* membri / sub / mod / donazioni: pannello oro */
  .card.vip { background: var(--gold); border-color: #fff3bf; }
  .card.vip .name { color: #fff; }
  .card.vip .head { background: #1a1400; }

  .message::-webkit-scrollbar { width: 6px; }
  .message::-webkit-scrollbar-thumb { background: var(--ink); border-radius: 3px; }
  .message::-webkit-scrollbar-track { background: transparent; }
</style>
</head>
<body>

<div id="container"></div>

<script>
  const urlParams = new URLSearchParams(window.location.search);
  const session = urlParams.get('session') || 'xMYd3nZK7g';
  const channel = parseInt(urlParams.get('channel') || '4', 10);
  const showtime = parseInt(urlParams.get('showtime')) || 12000; // ms, default 12s

  let socket = null;
  let hideTimer = null;

  /* etichette in italiano per eventi e donazioni */
  const LABELS = {
    donation: 'DONAZIONE', donations: 'DONAZIONE', tip: 'DONAZIONE',
    subscription: 'ABBONAMENTO', subscriber: 'SUB', sub: 'SUB', resub: 'RINNOVO',
    membership: 'MEMBRO', member: 'MEMBRO',
    giftsub: 'SUB REGALATO', giftedsub: 'SUB REGALATO', gift: 'REGALO',
    follow: 'NUOVO FOLLOWER', follower: 'NUOVO FOLLOWER',
    raid: 'RAID', cheer: 'BIT', bits: 'BIT',
    superchat: 'SUPER CHAT', supersticker: 'SUPER STICKER'
  };
  const label = k => LABELS[String(k || '').toLowerCase().replace(/[\s_-]/g, '')] || null;

  connect();

  function connect(){
    socket = new WebSocket('wss://io.socialstream.ninja:443');

    socket.addEventListener('open', () => {
      socket.send(JSON.stringify({ join: session, in: channel, out: channel }));
    });

    socket.addEventListener('message', (event) => {
      let data;
      try {
        data = JSON.parse(event.data);
      } catch(e){ return; }

      if (data && data.overlayNinja) data = data.overlayNinja;
      // ignora messaggi di sistema / join ack
      if (!data || (!data.chatmessage && !data.chatname)) return;

      renderMessage(data);
    });

    socket.addEventListener('close', () => {
      setTimeout(connect, 3000); // riconnessione automatica
    });

    socket.addEventListener('error', () => {
      socket.close();
    });
  }

  /* testo + sole emote <img>; tutto il resto viene scartato */
  function renderText(target, html) {
    const doc = new DOMParser().parseFromString('<div>' + (html || '') + '</div>', 'text/html');
    (function walk(node) {
      node.childNodes.forEach(n => {
        if (n.nodeType === 3) target.appendChild(document.createTextNode(n.textContent));
        else if (n.nodeName === 'IMG') {
          const src = n.getAttribute('src') || '';
          if (/^https?:\/\//i.test(src)) {
            const im = document.createElement('img'); im.src = src; target.appendChild(im);
          }
        } else walk(n);
      });
    })(doc.body.firstChild);
  }

  function renderMessage(data){
    const container = document.getElementById('container');
    container.innerHTML = '';

    const type = String(data.type || '').toLowerCase();
    const platform = type === 'youtube' ? 'youtube' : type === 'twitch' ? 'twitch' : 'other';

    /* etichette speciali (evento / donazione / ruolo) */
    const tags = [];
    const ev = label(data.event) || label(data.eventType);
    if (ev) tags.push(ev);
    if (data.hasDonation) tags.push('DONAZIONE ' + data.hasDonation);
    if (data.membership) tags.push('MEMBRO');
    else if (data.subscriber) tags.push('SUB');
    if (data.moderator || data.mod) tags.push('MOD');
    const vip = tags.length > 0;

    const card = document.createElement('div');
    card.className = 'card' + (vip ? ' vip' : '');

    const stripe = document.createElement('div'); stripe.className = 'stripe';
    const body = document.createElement('div'); body.className = 'body';
    const head = document.createElement('div'); head.className = 'head';

    if (data.chatimg) {
      const avatar = document.createElement('div');
      avatar.className = 'avatar';
      avatar.style.backgroundImage = 'url("' + String(data.chatimg).replace(/"/g, '%22') + '")';
      head.appendChild(avatar);
    }

    const name = document.createElement('div');
    name.className = 'name';
    name.textContent = data.chatname || '';
    head.appendChild(name);

    const right = document.createElement('div'); right.className = 'tags';
    tags.forEach(t => { const e = document.createElement('div'); e.className = 'tag'; e.textContent = t; right.appendChild(e); });
    const chip = document.createElement('div');
    chip.className = 'chip ' + platform;
    chip.textContent = platform === 'youtube' ? 'YouTube' : platform === 'twitch' ? 'Twitch' : (type || 'chat');
    right.appendChild(chip);
    head.appendChild(right);

    const message = document.createElement('div');
    message.className = 'message';
    renderText(message, data.chatmessage || '');

    body.appendChild(head);
    body.appendChild(message);
    card.appendChild(stripe);
    card.appendChild(body);
    container.appendChild(card);

    requestAnimationFrame(() => card.classList.add('show'));

    clearTimeout(hideTimer);
    hideTimer = setTimeout(() => {
      card.classList.remove('show');
      setTimeout(() => { container.innerHTML = ''; }, 400);
    }, showtime);
  }

  /* anteprima: ?demo */
  if (urlParams.has('demo')) {
    renderMessage({ chatname: 'Tifoso_Doc', chatmessage: 'Secondo me Spalletti deve cambiare modulo: il centrocampo è troppo lento e non copriamo le fasce!', type: 'youtube', membership: true });
  }
</script>

</body>
</html>
