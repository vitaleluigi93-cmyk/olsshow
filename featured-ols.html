<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<title>OLS Featured Chat</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Oswald:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #F7F3E8;
    --ink: #15151A;
    --plate: #15151A;
    --name: #F7F3E8;
    --gold: #F4C430;
    --cut: 34px;            /* taglio obliquo sul lato destro della targhetta */
    --edge: 5px;            /* spessore del filo oro sul taglio */
    --maxh: 230px;          /* altezza massima della barra (?maxh=): sotto, così non copre le cam */
  }
  * { margin:0; padding:0; box-sizing:border-box; }

  html, body {
    width:100vw; height:100vh;
    background: transparent;
    overflow: hidden;
    font-family: 'Oswald', 'Arial Narrow', sans-serif;
  }

  /* ancorato in basso a sinistra (stesso margine di 52px del banner) */
  body {
    display:flex; align-items:flex-end; justify-content:flex-start;
    padding: 0 0 40px 52px;
  }
  #container { display:flex; justify-content:flex-start; }

  /* barra chiara con filo oro da 4px: la targhetta scura occupa tutta l'altezza, quindi nome e messaggio restano centrati */
  .card {
    display:flex; align-items:stretch;
    width: fit-content;
    max-width: calc(100vw - 104px);   /* fino al margine destro (52px, simmetrico a sinistra) */
    min-height: 124px;
    padding: 0 56px 0 0;
    background: var(--paper);
    color: var(--ink);
    border-bottom: 4px solid var(--gold);
    opacity:0; transform: translateX(-48px);
    transition: opacity .5s ease, transform .6s cubic-bezier(.3,.7,.2,1);
  }
  .card.show { opacity:1; transform:none; }

  /* messaggi speciali: donazioni tutte oro, abbonamenti regalo viola (Twitch) o rosso (YouTube) */
  .card.don  { --paper:#F4C430; --ink:#15151A; border-bottom-color:#15151A; }
  .card.gift-twitch  { --paper:#9146FF; --ink:#FFFFFF; border-bottom-color:#5B2BB8; }
  .card.gift-youtube { --paper:#D6201B; --ink:#FFFFFF; border-bottom-color:#8E100C; }

  .plate {
    position: relative; isolation: isolate;
    flex: 0 0 auto;
    min-width: 340px; max-width: 600px;
    padding: 16px calc(var(--cut) + 24px) 16px 32px;
    display:flex; align-items:center; justify-content:center; gap:20px;
  }
  .plate::before, .plate::after { content:""; position:absolute; top:0; bottom:0; left:0; z-index:-1; }
  /* filo oro lungo il taglio obliquo */
  .plate::before {
    right: calc(var(--edge) * -1); background: var(--gold);
    clip-path: polygon(0 0, 100% 0, calc(100% - var(--cut)) 100%, 0 100%);
  }
  .plate::after {
    right: 0; background: var(--plate);
    clip-path: polygon(0 0, 100% 0, calc(100% - var(--cut)) 100%, 0 100%);
  }

  .avatar {
    flex: 0 0 auto;
    width: 66px; height: 66px; border-radius: 50%;
    background: var(--gold); color: #15151A;
    display:flex; align-items:center; justify-content:center;
    font-family: 'Bebas Neue', sans-serif; font-weight:400; font-size: 44px; padding-top: 4px;
    overflow: hidden;
  }
  .avatar { position: relative; }
  .avatar img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block; }
  .avatar.ok { background: transparent; }

  .pinfo { min-width:0; display:flex; flex-direction:column; justify-content:center; gap:9px; }
  .name {
    font-family: 'Bebas Neue', sans-serif; font-weight:400;
    font-size: 46px; line-height: 1.1; letter-spacing: .06em;
    color: var(--name);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    max-width: 460px;
  }
  .tag {
    font-size: 15px; font-weight:400; line-height: 1;
    letter-spacing: .32em; text-transform: uppercase;
    color: var(--tag, var(--gold));
    white-space: nowrap;
  }

  .msgbox { flex: 1; min-width: 0; display:flex; align-items:center; padding: 14px 0 16px 40px; }
  .message {
    color: var(--ink);
    font-weight: 400;
    line-height: 1.28;
    overflow-wrap: anywhere;
    white-space: pre-wrap;
    max-height: var(--maxh); overflow: hidden;
    font-size: 46px;
  }
  /* dimensione adattiva: i testi lunghi si allargano e si rimpiccioliscono, non si allungano in altezza */
  .message.l2 { font-size: 42px; }
  .message.l3 { font-size: 36px; }
  .message.l4 { font-size: 30px; }
  .message img { height:1.25em; width:auto; vertical-align:-0.25em; margin:0 2px; }

  @media (prefers-reduced-motion: reduce) { .card { transition-duration: .01s; } }
  /* nome degli abbonati, logo piattaforma, badge */
  .namerow { display:flex; align-items:center; gap:12px; min-width:0; }
  .name.sub { color: var(--subname, var(--gold)); }
  .badges { display:flex; align-items:center; gap:6px; flex:none; }
  .badges img { height: 32px; width:auto; display:block; }
  .tag { display:flex; align-items:center; gap:10px; }
  .tag .logo { display:inline-flex; flex:none; }
  .tag .logo svg { height: 1.4em; width:auto; display:block; }

  /* tema invertito (?tema=invertito): targhetta chiara, messaggio scuro */
  body.inv { --paper: #15151A; --ink: #F7F3E8; --plate: #F7F3E8; --name: #15151A; --tag: #7A5B00; --subname: #8A6700; }
</style>
</head>
<body>

<div id="container"></div>

<script>
  if ((new URLSearchParams(location.search).get('tema') || '') === 'invertito') document.body.classList.add('inv');
  const urlParams = new URLSearchParams(window.location.search);
  const session = urlParams.get('session') || 'xMYd3nZK7g';
  const channel = parseInt(urlParams.get('channel') || '2', 10); // 2 = messaggi scelti nel dock (4 = tutta la chat)
  const showtime = parseInt(urlParams.get('showtime')) || 0;     // ms; 0 = resta finché non lo togli da SSN
  if (urlParams.get('maxh')) document.documentElement.style.setProperty('--maxh', parseInt(urlParams.get('maxh'), 10) + 'px');
  const MAXH = () => parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--maxh')) || 230;

  let socket = null;
  let hideTimer = null;

  /* etichette in italiano per eventi e donazioni */
  const EVENT_LABELS = {
    donation: 'Donazione', donations: 'Donazione', tip: 'Donazione',
    subscription: 'Nuovo abbonato', subscriber: 'Nuovo abbonato', sub: 'Nuovo abbonato',
    resub: 'Abbonato', membership: 'Nuovo abbonato', member: 'Nuovo abbonato',
    giftsub: 'Abbonamento regalato', giftpurchase: 'Abbonamento regalato', giftredemption: 'Abbonamento regalato', giftmembership: 'Abbonamento regalato', giftedsub: 'Abbonamento regalato', gift: 'Abbonamento regalato',
    follow: 'Nuovo follower', follower: 'Nuovo follower',
    raid: 'Raid', cheer: 'Bit', bits: 'Bit',
    superchat: 'Super Chat', supersticker: 'Super Sticker'
  };
  const evLabel = k => EVENT_LABELS[String(k || '').toLowerCase().replace(/[\s_-]/g, '')] || null;

  /* diagnostica: aggiungi ?debug all'indirizzo per vedere lo stato della connessione e l'ultimo messaggio ricevuto */
  const DEBUG = urlParams.has('debug');
  function dbg(text){
    if (!DEBUG) return;
    let el = document.getElementById('dbg');
    if (!el) {
      el = document.createElement('div'); el.id = 'dbg';
      el.style.cssText = 'position:fixed;left:12px;top:12px;max-width:90vw;padding:8px 12px;background:rgba(0,0,0,.8);color:#9f9;font:14px/1.3 monospace;white-space:pre-wrap;z-index:99';
      document.body.appendChild(el);
    }
    el.textContent = text;
  }

  connect();

  function connect(){
    socket = new WebSocket('wss://io.socialstream.ninja:443');

    socket.addEventListener('open', () => {
      socket.send(JSON.stringify({ join: session, out: 3, in: channel }));
      dbg('CONNESSO · sessione ' + session + ' · canale ' + channel + '\nIn attesa di un messaggio scelto nel dock...');
    });

    socket.addEventListener('message', (event) => {
      dbg('ULTIMO MESSAGGIO RICEVUTO (' + new Date().toLocaleTimeString() + ')\n' + String(event.data).slice(0, 300));
      handle(event.data);
    });

    socket.addEventListener('close', () => { dbg('DISCONNESSO · riprovo tra 3 secondi'); setTimeout(connect, 3000); });
    socket.addEventListener('error', () => { socket.close(); });
  }

  /* logo piattaforma (SVG incluso nel file) e badge */
  const LOGOS = {
    youtube: '<svg viewBox="0 0 24 24" role="img" aria-label="YouTube"><path fill="#FF0000" d="M23.498 6.186a3.016 3.016 0 0 0-2.122-2.136C19.505 3.545 12 3.545 12 3.545s-7.505 0-9.377.505A3.017 3.017 0 0 0 .502 6.186C0 8.07 0 12 0 12s0 3.93.502 5.814a3.016 3.016 0 0 0 2.122 2.136c1.871.505 9.376.505 9.376.505s7.505 0 9.377-.505a3.015 3.015 0 0 0 2.122-2.136C24 15.93 24 12 24 12s0-3.93-.502-5.814zM9.545 15.568V8.432L15.818 12l-6.273 3.568z"/></svg>',
    twitch:  '<svg viewBox="0 0 24 24" role="img" aria-label="Twitch"><path fill="#9146FF" d="M11.571 4.714h1.715v5.143H11.57zm4.715 0H18v5.143h-1.714zM6 0L1.714 4.286v15.428h5.143V24l4.286-4.286h3.428L22.286 12V0zm14.571 11.143l-3.428 3.428h-3.429l-3 3v-3H6.857V1.714h13.714Z"/></svg>'
  };
  function buildTag(tagEl, type, parts){
    if (LOGOS[type]) { const l = document.createElement('span'); l.className = 'logo'; l.innerHTML = LOGOS[type]; tagEl.appendChild(l); }
    if (parts.length) { const t = document.createElement('span'); t.textContent = parts.join(' \u00b7 '); tagEl.appendChild(t); }
  }
  /* badge ufficiali inviati da SSN (chatbadges); ?badges=0 li nasconde, ?badges=tutti li mostra tutti; di default solo quello da abbonato */
  function buildBadges(list, isSub){
    const q = new URLSearchParams(location.search).get('badges');
    if (q === '0') return null;
    const SUB = /subscriber|sub[-_ ]?badge|member|abbonat|founder|sponsor/i;
    const OTHER = /moderator|\bmod\b|vip|broadcaster|owner|staff|admin|verified|partner|bits|cheer|turbo|prime|premiere|hype|glhf|sub-gift|gifter|predictions|no_audio|no_video/i;
    const wrap = document.createElement('div'); wrap.className = 'badges';
    const items = (Array.isArray(list) ? list : []).filter(b => {
      const src = typeof b === 'string' ? b : (b && b.src);
      return src && /^(https?:|data:image\/)/i.test(src);
    });
    const descOf = b => typeof b === 'string' ? b : [b.type, b.text, b.title, b.src].join(' ');
    const mk = b => { const im = document.createElement('img'); im.referrerPolicy = 'no-referrer'; im.src = typeof b === 'string' ? b : b.src; im.onerror = () => im.remove(); wrap.appendChild(im); };
    if (q === 'tutti') items.slice(0, 3).forEach(mk);
    else {
      /* 1) badge riconosciuto come abbonato; 2) se l'utente è abbonato ma i badge non hanno descrizione (caso YouTube), il primo non riconosciuto come mod/VIP/ecc. */
      let pick = items.find(b => SUB.test(descOf(b)) && !OTHER.test(descOf(b)));
      if (!pick && isSub) pick = items.find(b => !OTHER.test(descOf(b)));
      if (pick) mk(pick);
    }
    return wrap.children.length ? wrap : null;
  }

  /* testo + sole emote <img>; tutto il resto viene scartato */
  function renderText(target, html) {
    const doc = new DOMParser().parseFromString('<div>' + (html || '') + '</div>', 'text/html');
    (function walk(node) {
      node.childNodes.forEach(n => {
        if (n.nodeType === 3) target.appendChild(document.createTextNode(n.textContent));
        else if (n.nodeName === 'IMG') {
          const src = n.getAttribute('src') || '';
          if (/^https?:\/\//i.test(src)) {
            const im = document.createElement('img'); im.src = src; target.appendChild(im);
          }
        } else walk(n);
      });
    })(doc.body.firstChild);
  }

  /* stessa logica di featured.html di SSN: messaggio scelto = mostra, "false"/clear = togli */
  function handle(raw){
    let data;
    try { data = (typeof raw === 'string') ? JSON.parse(raw) : raw; } catch(e){ return; }
    if (data && typeof data === 'object' && 'overlayNinja' in data) data = data.overlayNinja;

    if (data === false || data === null) { clearMessage(); return; }
    if (!data || typeof data !== 'object') return;
    if (data.get || data.callback) return;                                  // risposte di servizio
    if (data.target && data.target !== 'null') return;                      // destinato a un altro overlay

    if ('content' in data) {
      if (data.content && typeof data.content === 'object') renderMessage(data.content); else clearMessage();
    } else if (data.action === 'content') {
      let v = data.value;
      if (typeof v === 'string') { try { v = JSON.parse(v); } catch(e) { v = false; } }
      if (v && typeof v === 'object' && v.chatmessage !== undefined) renderMessage(v); else clearMessage();
    } else if (data.action === 'clear') {
      clearMessage();
    } else if (!('action' in data) && ('chatmessage' in data)) {
      renderMessage(data);
    }
  }

  function clearMessage(){
    clearTimeout(hideTimer);
    const card = document.querySelector('#container .card');
    if (!card) return;
    card.classList.remove('show');
    setTimeout(() => { if (!card.classList.contains('show')) card.remove(); }, 600);
  }

  /* riduce il testo, se serve, perché la barra non superi mai l'altezza massima (così non copre le cam) */
  function fitCard(){
    const card = document.querySelector('#container .card');
    if (!card) return;
    const m = card.querySelector('.message');
    m.style.fontSize = '';
    let fs = parseFloat(getComputedStyle(m).fontSize);
    while (card.offsetHeight > MAXH() && fs > 22) { fs -= 2; m.style.fontSize = fs + 'px'; }
  }
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(fitCard);

  function renderMessage(data){
    try { renderMessageFull(data); }
    catch (e) {
      console.error('featured render', e); dbg('ERRORE DI VISUALIZZAZIONE\n' + (e && e.stack || e));
      const c = document.getElementById('container'); c.innerHTML = '';
      const card = document.createElement('div'); card.className = 'card show';
      const p = document.createElement('div'); p.className = 'plate';
      const n = document.createElement('div'); n.className = 'name'; n.textContent = String((data && data.chatname) || '');
      p.appendChild(n);
      const mb = document.createElement('div'); mb.className = 'msgbox';
      const m = document.createElement('div'); m.className = 'message'; m.textContent = String((data && data.chatmessage) || '').replace(/<[^>]*>/g, '');
      mb.appendChild(m); card.appendChild(p); card.appendChild(mb); c.appendChild(card);
    }
  }

  function renderMessageFull(data){
    const container = document.getElementById('container');
    container.innerHTML = '';

    const name = String(data.chatname || '').trim();
    const raw = String(data.chatmessage || '');
    const plainLen = raw.replace(/<[^>]*>/g, '').length;

    const type = String(data.type || '').toLowerCase();
    const platformName = type === 'youtube' ? 'YouTube' : type === 'twitch' ? 'Twitch' : (type || 'Chat');

    const ev = evLabel(data.event) || evLabel(data.eventType);
    const isSub = !!(data.membership || data.subscriber || data.hasMembership || data.sub || (data.meta && (data.meta.membership || data.meta.subscriber)));
    dbg('DATI MESSAGGIO\nnome: ' + name + '\ntype: ' + type + '\nmembership: ' + JSON.stringify(data.membership) + '\nsubscriber: ' + JSON.stringify(data.subscriber) + '\nhasMembership: ' + JSON.stringify(data.hasMembership) + '\nevent: ' + JSON.stringify(data.event) + '\nabbonato riconosciuto: ' + isSub + '\nchatbadges: ' + JSON.stringify(data.chatbadges).slice(0, 600));
    const extra = data.hasDonation ? ('Donazione ' + data.hasDonation) : ev;
    const tagParts = [];
    if (!LOGOS[type]) tagParts.push(platformName);
    if (isSub) tagParts.push('Abbonato');
    if (extra) tagParts.push(extra);

    const evKey = String(data.event || data.eventType || '').toLowerCase().replace(/[\s_-]/g, '');
    const isDon = !!data.hasDonation || /^(donation|donations|tip|cheer|bits|superchat|supersticker)$/.test(evKey);
    const isGift = !isDon && /gift/.test(evKey);
    const card = document.createElement('div');
    card.className = 'card' + (isDon ? ' don' : isGift ? ' gift-' + (type === 'youtube' ? 'youtube' : 'twitch') : '');

    /* placca: avatar + nome + piattaforma/abbonato */
    const plate = document.createElement('div'); plate.className = 'plate';
    const avatar = document.createElement('div'); avatar.className = 'avatar';
    const initial = () => { avatar.textContent = (name[0] || '?').toUpperCase(); };
    if (data.chatimg) {
      const im = document.createElement('img');
      im.referrerPolicy = 'no-referrer';
      im.src = data.chatimg;
      im.onload = () => avatar.classList.add('ok');
      im.onerror = () => { im.remove(); initial(); };
      avatar.appendChild(im);
    } else initial();
    const pinfo = document.createElement('div'); pinfo.className = 'pinfo';
    const nm = document.createElement('div'); nm.className = 'name'; nm.textContent = name;
    const tag = document.createElement('div'); tag.className = 'tag'; buildTag(tag, type, tagParts);
    if (isSub) nm.classList.add('sub');
    const row = document.createElement('div'); row.className = 'namerow'; row.appendChild(nm);
    let bd = null; try { bd = buildBadges(data.chatbadges, isSub); } catch (e) { bd = null; } if (bd) row.appendChild(bd);
    pinfo.appendChild(row); pinfo.appendChild(tag);
    plate.appendChild(avatar); plate.appendChild(pinfo);

    /* messaggio */
    const msgbox = document.createElement('div'); msgbox.className = 'msgbox';
    const message = document.createElement('div');
    message.className = 'message' + (plainLen > 280 ? ' l4' : plainLen > 150 ? ' l3' : plainLen > 70 ? ' l2' : '');
    renderText(message, raw);
    msgbox.appendChild(message);

    card.appendChild(plate); card.appendChild(msgbox);
    container.appendChild(card);
    fitCard();

    requestAnimationFrame(() => card.classList.add('show'));

    /* nessuna scomparsa automatica: resta finché non lo togli o ne scegli un altro (solo con ?showtime=ms) */
    clearTimeout(hideTimer);
    if (showtime > 0) hideTimer = setTimeout(clearMessage, showtime);
  }

  /* anteprima: ?demo (abbonato) · ?demo=corto · ?demo=lungo · ?demo=donazione · ?demo=regalo · ?demo=regaloyt */
  if (urlParams.has('demo')) {
    const d = urlParams.get('demo');
    const sample = {
      donazione: { chatname: 'Zebrina99', chatmessage: 'Grande OLS, continuate così!', type: 'youtube', hasDonation: '€5,00', event: 'superchat' },
      regalo: { chatname: 'Tifoso_Doc', chatmessage: 'Ha regalato 5 abbonamenti alla community!', type: 'twitch', event: 'giftsub' },
      regaloyt: { chatname: 'Tifoso_Doc', chatmessage: 'Ha regalato 5 abbonamenti alla community!', type: 'youtube', event: 'giftpurchase' },
      corto: { chatname: 'Zebrina99', chatmessage: 'Fino alla fine!', type: 'twitch' },
      lungo: { chatname: 'Marco_Bianconero', chatmessage: 'Secondo me Spalletti deve cambiare modulo: il centrocampo è troppo lento, non copriamo le fasce e quando perdiamo palla in uscita siamo sempre scoperti. Con Locatelli e Thuram più vicini a Yildiz la squadra respira, ma serve qualcuno che giochi tra le linee senza aspettare il tuo passaggio, altrimenti ripetiamo sempre la stessa partita.', type: 'youtube' }
    };
    renderMessage(sample[d] || { chatname: 'oldladyshow', chatmessage: 'Secondo me Spalletti deve cambiare modulo: il centrocampo è troppo lento e non copriamo le fasce.', type: 'twitch', membership: true, chatbadges: [{type:'subscriber', text:'Abbonato', src:'data:image/svg+xml,%3Csvg%20xmlns%3D%27http%3A//www.w3.org/2000/svg%27%20viewBox%3D%270%200%2036%2036%27%3E%3Crect%20width%3D%2736%27%20height%3D%2736%27%20rx%3D%276%27%20fill%3D%27%239146FF%27/%3E%3Cpath%20d%3D%27M18%207l3.2%207%207.6.8-5.7%205.1%201.7%207.5L18%2023.4%2011.2%2027.4l1.7-7.5-5.7-5.1%207.6-.8z%27%20fill%3D%27%23fff%27/%3E%3C/svg%3E'}] });
  }
</script>

</body>
</html>
