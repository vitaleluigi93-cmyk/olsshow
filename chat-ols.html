<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<title>OLS Chat Overlay</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Oswald:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #F7F3E8;
    --ink: #15151A;
    --plate: #15151A;
    --name: #F7F3E8;
    --gold: #F4C430;
    --cut: 18px;
    --edge: 3px;
    --w: 780px;          /* larghezza massima colonna (?width=) */
    --scale: 1;          /* scala generale (?scale=) */
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 100%; height: 100%;
    background: transparent;
    overflow: hidden;
    font-family: 'Oswald', sans-serif;
  }
  #stack {
    position: absolute;
    left: 52px; bottom: 40px;
    width: var(--w);
    display: flex; flex-direction: column; align-items: flex-start; justify-content: flex-end;
    gap: 12px;
    transform: scale(var(--scale));
    transform-origin: left bottom;
  }
  body.right #stack { left: auto; right: 52px; align-items: flex-end; transform-origin: right bottom; }

  /* barra chiara con filo oro da 4px: la targhetta scura occupa tutta l'altezza, quindi nome e messaggio restano centrati */
  .msg {
    display: flex; align-items: stretch;
    width: fit-content; max-width: 100%;
    min-height: 78px;
    padding: 0 28px 0 0;
    background: var(--paper);
    color: var(--ink);
    border-bottom: 4px solid var(--gold);
    animation: in .5s cubic-bezier(.3,.7,.2,1) both;
  }
  .msg.don { --paper:#F4C430; --ink:#15151A; border-bottom-color:#15151A; }
  .msg.out { animation: out .3s ease-in both; }

  .plate {
    position: relative; isolation: isolate;
    flex: 0 0 auto;
    min-width: 250px; max-width: 340px;
    padding: 10px calc(var(--cut) + 14px) 10px 18px;
    display: flex; align-items: center; justify-content: center; gap: 12px;
  }
  .plate::before, .plate::after { content: ""; position: absolute; top: 0; bottom: 0; left: 0; z-index: -1; }
  .plate::before {
    right: calc(var(--edge) * -1); background: var(--gold);
    clip-path: polygon(0 0, 100% 0, calc(100% - var(--cut)) 100%, 0 100%);
  }
  .plate::after {
    right: 0; background: var(--plate);
    clip-path: polygon(0 0, 100% 0, calc(100% - var(--cut)) 100%, 0 100%);
  }

  .avatar {
    flex: 0 0 auto;
    width: 46px; height: 46px; border-radius: 50%;
    background: var(--gold); color: #15151A;
    display: flex; align-items: center; justify-content: center;
    font-family: 'Bebas Neue', sans-serif; font-weight: 400; font-size: 30px; padding-top: 3px;
    overflow: hidden;
  }
  .avatar { position: relative; }
  .avatar img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block; }
  .avatar.ok { background: transparent; }

  .pinfo { min-width: 0; display: flex; flex-direction: column; justify-content: center; gap: 5px; }
  .name {
    font-family: 'Bebas Neue', sans-serif; font-weight: 400;
    font-size: 32px; line-height: 1.12; letter-spacing: .06em;
    color: var(--name);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    max-width: 210px;
  }
  .tag {
    font-size: 11px; font-weight: 400; line-height: 1;
    letter-spacing: .3em; text-transform: uppercase;
    color: var(--tag, var(--gold)); white-space: nowrap;
  }

  .text {
    align-self: center;
    padding: 14px 0 16px 28px;
    font-weight: 400; font-size: 26px; line-height: 1.25;
    color: var(--ink);
    overflow-wrap: anywhere;
  }
  .text img { height: 1.35em; width: auto; vertical-align: -0.3em; margin: 0 1px; }

  @keyframes in  { from { transform: translateX(-30px); opacity: 0; } to { transform: none; opacity: 1; } }
  @keyframes out { from { opacity: 1; } to { opacity: 0; } }
  @media (prefers-reduced-motion: reduce) { .msg { animation-duration: .01s; } }
  /* nome degli abbonati, logo piattaforma, badge */
  .namerow { display:flex; align-items:center; gap:12px; min-width:0; }
  .name.sub { color: var(--subname, var(--gold)); }
  .badges { display:flex; align-items:center; gap:6px; flex:none; }
  .badges img { height: 22px; width:auto; display:block; }
  .tag { display:flex; align-items:center; gap:10px; }
  .tag .logo { display:inline-flex; flex:none; }
  .tag .logo svg { height: 1.4em; width:auto; display:block; }

  /* tema invertito (?tema=invertito): targhetta chiara, messaggio scuro */
  body.inv { --paper: #15151A; --ink: #F7F3E8; --plate: #F7F3E8; --name: #15151A; --tag: #7A5B00; --subname: #8A6700; }
</style>
</head>
<body>
<div id="stack"></div>

<script>
  if ((new URLSearchParams(location.search).get('tema') || '') === 'invertito') document.body.classList.add('inv');
(function () {
  const q = new URLSearchParams(location.search);
  const SESSION  = q.get('session') || 'xMYd3nZK7g';
  const CHANNEL  = q.get('channel') || '4';
  const MAX      = parseInt(q.get('max') || '3', 10);          // messaggi visibili (i più vecchi vengono tolti)
  const SHOWTIME = parseInt(q.get('showtime') || '0', 10);      // secondi; 0 = restano finché non vengono spinti via
  const HIDEBOTS = (q.get('hidebots') || 'streamelements,nightbot,streamlabs,moobot,restream,fossabot').toLowerCase().split(',');
  if (q.get('width'))  document.documentElement.style.setProperty('--w', q.get('width') + 'px');
  if (q.get('scale'))  document.documentElement.style.setProperty('--scale', q.get('scale'));
  if (q.get('side') === 'right') document.body.classList.add('right');

  const stack = document.getElementById('stack');
  const seen = new Set();

  /* logo piattaforma (SVG incluso nel file) e badge */
  const LOGOS = {
    youtube: '<svg viewBox="0 0 24 24" role="img" aria-label="YouTube"><path fill="#FF0000" d="M23.498 6.186a3.016 3.016 0 0 0-2.122-2.136C19.505 3.545 12 3.545 12 3.545s-7.505 0-9.377.505A3.017 3.017 0 0 0 .502 6.186C0 8.07 0 12 0 12s0 3.93.502 5.814a3.016 3.016 0 0 0 2.122 2.136c1.871.505 9.376.505 9.376.505s7.505 0 9.377-.505a3.015 3.015 0 0 0 2.122-2.136C24 15.93 24 12 24 12s0-3.93-.502-5.814zM9.545 15.568V8.432L15.818 12l-6.273 3.568z"/></svg>',
    twitch:  '<svg viewBox="0 0 24 24" role="img" aria-label="Twitch"><path fill="#9146FF" d="M11.571 4.714h1.715v5.143H11.57zm4.715 0H18v5.143h-1.714zM6 0L1.714 4.286v15.428h5.143V24l4.286-4.286h3.428L22.286 12V0zm14.571 11.143l-3.428 3.428h-3.429l-3 3v-3H6.857V1.714h13.714Z"/></svg>'
  };
  function buildTag(tagEl, type, parts){
    if (LOGOS[type]) { const l = document.createElement('span'); l.className = 'logo'; l.innerHTML = LOGOS[type]; tagEl.appendChild(l); }
    if (parts.length) { const t = document.createElement('span'); t.textContent = parts.join(' \u00b7 '); tagEl.appendChild(t); }
  }
  /* badge ufficiali inviati da SSN (chatbadges); ?badges=0 li nasconde, ?badges=tutti li mostra tutti; di default solo quello da abbonato */
  function buildBadges(list){
    const q = new URLSearchParams(location.search).get('badges');
    if (q === '0') return null;
    const SUB = /subscriber|sub[-_ ]?badge|member|abbonat|founder|sponsor/i;
    const OTHER = /moderator|\bmod\b|vip|broadcaster|owner|staff|admin|verified|partner|bits|cheer|turbo|prime|premiere|hype|glhf|sub-gift|gifter|predictions|no_audio|no_video/i;
    const wrap = document.createElement('div'); wrap.className = 'badges';
    for (const b of (Array.isArray(list) ? list : [])) {
      const src = typeof b === 'string' ? b : (b && b.src);
      if (!src || !/^(https?:|data:image\/)/i.test(src)) continue;
      const desc = typeof b === 'string' ? b : [b.type, b.text, b.title, b.src].join(' ');
      if (q !== 'tutti' && (!SUB.test(desc) || OTHER.test(desc))) continue;
      const im = document.createElement('img'); im.referrerPolicy = 'no-referrer'; im.src = src; im.onerror = () => im.remove();
      wrap.appendChild(im);
      if (q !== 'tutti') break;
    }
    return wrap.children.length ? wrap : null;
  }

  /* testo + sole emote <img>; tutto il resto viene scartato */
  function renderText(target, html) {
    const doc = new DOMParser().parseFromString('<div>' + (html || '') + '</div>', 'text/html');
    (function walk(node) {
      node.childNodes.forEach(n => {
        if (n.nodeType === 3) target.appendChild(document.createTextNode(n.textContent));
        else if (n.nodeName === 'IMG') {
          const src = n.getAttribute('src') || '';
          if (/^https?:\/\//i.test(src)) {
            const im = document.createElement('img'); im.src = src; target.appendChild(im);
          }
        } else walk(n);
      });
    })(doc.body.firstChild);
  }

  function remove(el) {
    if (!el || el.classList.contains('out')) return;
    el.classList.add('out');
    setTimeout(() => el.remove(), 330);
  }

  function addMessage(m) {
    const name = (m.chatname || '').trim();
    const text = m.chatmessage || '';
    if (!name || !text) return;
    if (m.event) return;                                         // niente eventi (sub, donazioni...) nella chat
    if (HIDEBOTS.includes(name.toLowerCase())) return;
    if (text.trim().startsWith('!')) return;                     // comandi

    const id = m.id || (name + '|' + text + '|' + (m.timestamp || ''));
    if (seen.has(id)) return;
    seen.add(id); if (seen.size > 500) seen.delete(seen.values().next().value);

    const type = (m.type || '').toLowerCase();
    const platform = type === 'youtube' ? 'youtube' : type === 'twitch' ? 'twitch' : 'other';
    const platformName = platform === 'youtube' ? 'YouTube' : platform === 'twitch' ? 'Twitch' : (type || 'Chat');
    const isSub = !!(m.membership || m.subscriber || m.hasMembership);

    const tagParts = [];
    if (!LOGOS[type]) tagParts.push(platformName);
    if (isSub) tagParts.push('Abbonato');

    const el = document.createElement('div');
    el.className = 'msg';

    const plate = document.createElement('div'); plate.className = 'plate';
    const avatar = document.createElement('div'); avatar.className = 'avatar';
    const initial = () => { avatar.textContent = (name[0] || '?').toUpperCase(); };
    if (m.chatimg) {
      const im = document.createElement('img');
      im.referrerPolicy = 'no-referrer';
      im.src = m.chatimg;
      im.onload = () => avatar.classList.add('ok');
      im.onerror = () => { im.remove(); initial(); };
      avatar.appendChild(im);
    } else initial();
    const pinfo = document.createElement('div'); pinfo.className = 'pinfo';
    const nm = document.createElement('div'); nm.className = 'name'; nm.textContent = name;
    const tag = document.createElement('div'); tag.className = 'tag'; buildTag(tag, type, tagParts);
    if (isSub) nm.classList.add('sub');
    const row = document.createElement('div'); row.className = 'namerow'; row.appendChild(nm);
    const bd = buildBadges(m.chatbadges); if (bd) row.appendChild(bd);
    pinfo.appendChild(row); pinfo.appendChild(tag);
    plate.appendChild(avatar); plate.appendChild(pinfo);

    if (m.hasDonation) el.classList.add('don');
    const tx = document.createElement('div'); tx.className = 'text'; renderText(tx, text);
    el.appendChild(plate); el.appendChild(tx);
    stack.appendChild(el);

    const live = () => Array.from(stack.children).filter(c => !c.classList.contains('out'));
    while (live().length > MAX) remove(live()[0]);
    if (SHOWTIME > 0) setTimeout(() => remove(el), SHOWTIME * 1000);
  }

  /* ---------- WebSocket SSN ---------- */
  let ws, retry = 1000;
  function handle(raw) {
    let d; try { d = JSON.parse(raw); } catch (e) { return; }
    const list = Array.isArray(d) ? d : [d];
    list.forEach(x => {
      if (!x) return;
      if (x.overlayNinja) x = x.overlayNinja;
      if (x.chatname !== undefined) addMessage(x);
    });
  }
  function connect() {
    ws = new WebSocket('wss://io.socialstream.ninja:443');
    ws.onopen = () => {
      retry = 1000;
      ws.send(JSON.stringify({ join: SESSION, in: parseInt(CHANNEL, 10), out: parseInt(CHANNEL, 10) }));
    };
    ws.onmessage = e => handle(e.data);
    ws.onclose = () => { setTimeout(connect, retry); retry = Math.min(retry * 2, 15000); };
    ws.onerror = () => ws.close();
  }

  if (q.has('demo')) {
    const demo = [
      { chatname: 'Marco_Bianconero', chatmessage: 'Che partita ragazzi, Yildiz ha spaccato tutto!', type: 'youtube' },
      { chatname: 'Zebrina99', chatmessage: 'Fino alla fine forza Juve!', type: 'twitch', subscriber: true, chatbadges: [{type:'subscriber', text:'Abbonato', src:'data:image/svg+xml,%3Csvg%20xmlns%3D%27http%3A//www.w3.org/2000/svg%27%20viewBox%3D%270%200%2036%2036%27%3E%3Crect%20width%3D%2736%27%20height%3D%2736%27%20rx%3D%276%27%20fill%3D%27%239146FF%27/%3E%3Cpath%20d%3D%27M18%207l3.2%207%207.6.8-5.7%205.1%201.7%207.5L18%2023.4%2011.2%2027.4l1.7-7.5-5.7-5.1%207.6-.8z%27%20fill%3D%27%23fff%27/%3E%3C/svg%3E'}] },
      { chatname: 'Tifoso_Doc', chatmessage: 'Secondo me Spalletti deve cambiare modulo, il centrocampo è troppo lento e non copriamo le fasce', type: 'youtube', membership: true },
      { chatname: 'Antimo_fan', chatmessage: 'Pagelle a fine partita? 7 a Locatelli', type: 'twitch' },
    ];
    demo.forEach((m, i) => setTimeout(() => addMessage(Object.assign({ id: 'd' + i }, m)), i * 600));
  } else {
    connect();
  }
})();
</script>
</body>
</html>
