<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<title>OLS Chat Overlay</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #f6f1e4;
    --ink: #14120d;
    --muted: #6b665a;
    --gold: #F4C430;
    --gold-text: #8a6700;
    --yt: #e62117;
    --tw: #8a4fff;
    --w: 620px;          /* larghezza massima colonna (?width=) */
    --scale: 1;          /* scala generale (?scale=) */
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 100%; height: 100%;
    background: transparent;
    overflow: hidden;
    font-family: 'Oswald', sans-serif;
  }
  #stack {
    position: absolute;
    left: 28px; bottom: 28px;
    width: var(--w);
    display: flex; flex-direction: column; align-items: flex-start; justify-content: flex-end;
    gap: 10px;
    transform: scale(var(--scale));
    transform-origin: left bottom;
  }
  body.right #stack { left: auto; right: 28px; align-items: flex-end; transform-origin: right bottom; }

  .msg {
    display: flex; align-items: flex-start; gap: 14px;
    width: fit-content; max-width: 100%;
    padding: 12px 20px 13px 14px;
    background: var(--paper);
    border-radius: 8px;
    box-shadow: 0 4px 14px rgba(0,0,0,.32);
    animation: in .4s cubic-bezier(.2,.8,.25,1) both;
  }
  .msg.sub { box-shadow: inset 5px 0 0 var(--gold), 0 4px 14px rgba(0,0,0,.32); padding-left: 20px; }
  .msg.out { animation: out .3s ease-in both; }

  .avatar {
    flex: 0 0 auto;
    width: 44px; height: 44px; border-radius: 50%;
    background: var(--gold); color: var(--ink);
    display: flex; align-items: center; justify-content: center;
    font-weight: 600; font-size: 22px;
    overflow: hidden;
  }
  .avatar img { width: 100%; height: 100%; object-fit: cover; display: block; }

  .content { min-width: 0; }
  .who { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; line-height: 1.1; }
  .name { font-weight: 600; font-size: 21px; color: var(--ink); }
  .meta { display: flex; align-items: center; gap: 10px; font-size: 15px; font-weight: 500; color: var(--muted); }
  .platform { display: flex; align-items: center; gap: 6px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: #888; }
  .dot.youtube { background: var(--yt); }
  .dot.twitch { background: var(--tw); }
  .badge { color: var(--gold-text); font-weight: 600; }

  .text {
    margin-top: 3px;
    font-weight: 400; font-size: 25px; line-height: 1.25;
    color: var(--ink);
    overflow-wrap: anywhere;
  }
  .text img { height: 1.35em; width: auto; vertical-align: -0.3em; margin: 0 1px; }

  @keyframes in  { from { transform: translateY(14px); opacity: 0; } to { transform: none; opacity: 1; } }
  @keyframes out { from { opacity: 1; } to { opacity: 0; } }
</style>
</head>
<body>
<div id="stack"></div>

<script>
(function () {
  const q = new URLSearchParams(location.search);
  const SESSION  = q.get('session') || 'xMYd3nZK7g';
  const CHANNEL  = q.get('channel') || '4';
  const MAX      = parseInt(q.get('max') || '6', 10);          // messaggi visibili
  const SHOWTIME = parseInt(q.get('showtime') || '0', 10);      // secondi; 0 = restano finché non vengono spinti via
  const HIDEBOTS = (q.get('hidebots') || 'streamelements,nightbot,streamlabs,moobot,restream,fossabot').toLowerCase().split(',');
  if (q.get('width'))  document.documentElement.style.setProperty('--w', q.get('width') + 'px');
  if (q.get('scale'))  document.documentElement.style.setProperty('--scale', q.get('scale'));
  if (q.get('side') === 'right') document.body.classList.add('right');

  const stack = document.getElementById('stack');
  const seen = new Set();

  /* testo + sole emote <img>; tutto il resto viene scartato */
  function renderText(target, html) {
    const doc = new DOMParser().parseFromString('<div>' + (html || '') + '</div>', 'text/html');
    (function walk(node) {
      node.childNodes.forEach(n => {
        if (n.nodeType === 3) target.appendChild(document.createTextNode(n.textContent));
        else if (n.nodeName === 'IMG') {
          const src = n.getAttribute('src') || '';
          if (/^https?:\/\//i.test(src)) {
            const im = document.createElement('img'); im.src = src; target.appendChild(im);
          }
        } else walk(n);
      });
    })(doc.body.firstChild);
  }

  function remove(el) {
    if (!el || el.classList.contains('out')) return;
    el.classList.add('out');
    setTimeout(() => el.remove(), 330);
  }

  function addMessage(m) {
    const name = (m.chatname || '').trim();
    const text = m.chatmessage || '';
    if (!name || !text) return;
    if (m.event) return;                                         // niente eventi (sub, donazioni...) nella chat
    if (HIDEBOTS.includes(name.toLowerCase())) return;
    if (text.trim().startsWith('!')) return;                     // comandi

    const id = m.id || (name + '|' + text + '|' + (m.timestamp || ''));
    if (seen.has(id)) return;
    seen.add(id); if (seen.size > 500) seen.delete(seen.values().next().value);

    const type = (m.type || '').toLowerCase();
    const platform = type === 'youtube' ? 'youtube' : type === 'twitch' ? 'twitch' : 'other';
    const platformName = platform === 'youtube' ? 'YouTube' : platform === 'twitch' ? 'Twitch' : (type || 'Chat');
    const isSub = !!(m.membership || m.subscriber || m.hasMembership);

    const el = document.createElement('div');
    el.className = 'msg' + (isSub ? ' sub' : '');

    const avatar = document.createElement('div'); avatar.className = 'avatar';
    const initial = () => { avatar.textContent = (name[0] || '?').toUpperCase(); };
    if (m.chatimg) {
      const im = document.createElement('img');
      im.referrerPolicy = 'no-referrer';
      im.src = m.chatimg;
      im.onerror = () => { im.remove(); initial(); };
      avatar.appendChild(im);
    } else initial();

    const content = document.createElement('div'); content.className = 'content';
    const who = document.createElement('div'); who.className = 'who';
    const nm = document.createElement('div'); nm.className = 'name'; nm.textContent = name;
    const meta = document.createElement('div'); meta.className = 'meta';
    const pf = document.createElement('div'); pf.className = 'platform';
    const dot = document.createElement('span'); dot.className = 'dot ' + platform;
    const pfText = document.createElement('span'); pfText.textContent = platformName;
    pf.appendChild(dot); pf.appendChild(pfText); meta.appendChild(pf);
    if (isSub) { const b = document.createElement('span'); b.className = 'badge'; b.textContent = 'Abbonato'; meta.appendChild(b); }
    who.appendChild(nm); who.appendChild(meta);

    const tx = document.createElement('div'); tx.className = 'text'; renderText(tx, text);
    content.appendChild(who); content.appendChild(tx);
    el.appendChild(avatar); el.appendChild(content);
    stack.appendChild(el);

    while (stack.children.length > MAX) remove(stack.firstElementChild);
    if (SHOWTIME > 0) setTimeout(() => remove(el), SHOWTIME * 1000);
  }

  /* ---------- WebSocket SSN ---------- */
  let ws, retry = 1000;
  function handle(raw) {
    let d; try { d = JSON.parse(raw); } catch (e) { return; }
    const list = Array.isArray(d) ? d : [d];
    list.forEach(x => {
      if (!x) return;
      if (x.overlayNinja) x = x.overlayNinja;
      if (x.chatname !== undefined) addMessage(x);
    });
  }
  function connect() {
    ws = new WebSocket('wss://io.socialstream.ninja:443');
    ws.onopen = () => {
      retry = 1000;
      ws.send(JSON.stringify({ join: SESSION, in: parseInt(CHANNEL, 10), out: parseInt(CHANNEL, 10) }));
    };
    ws.onmessage = e => handle(e.data);
    ws.onclose = () => { setTimeout(connect, retry); retry = Math.min(retry * 2, 15000); };
    ws.onerror = () => ws.close();
  }

  if (q.has('demo')) {
    const demo = [
      { chatname: 'Marco_Bianconero', chatmessage: 'Che partita ragazzi, Yildiz ha spaccato tutto!', type: 'youtube' },
      { chatname: 'Zebrina99', chatmessage: 'Fino alla fine forza Juve!', type: 'twitch', subscriber: true },
      { chatname: 'Tifoso_Doc', chatmessage: 'Secondo me Spalletti deve cambiare modulo, il centrocampo è troppo lento e non copriamo le fasce', type: 'youtube', membership: true },
      { chatname: 'Antimo_fan', chatmessage: 'Pagelle a fine partita? 7 a Locatelli', type: 'twitch' },
    ];
    demo.forEach((m, i) => setTimeout(() => addMessage(Object.assign({ id: 'd' + i }, m)), i * 600));
  } else {
    connect();
  }
})();
</script>
</body>
</html>
